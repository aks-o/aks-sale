<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AKS SALE Admin - Login</title>
  <link rel="stylesheet" href="/admin/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">AKS Sales</div>
      <h1>Admin Login</h1>
      <p>Enter your credentials to access the dashboard</p>

      <form id="loginForm" class="login-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="admin@aks-sale.com" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Password" />
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <span>Sign In</span>
        </button>

        <p id="loginError" class="form-error hidden"></p>
      </form>
    </div>
  </div>

  <script type="module" src="/admin/login.js"></script>
</body>
</html>
