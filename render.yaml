databases:
  - name: aks-sales-db
    region: omaha
    plan: free

services:
  - type: web
    name: aks-sales
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FROM_EMAIL
        value: info@aks-sale.com
      - key: FROM_NAME
        value: AKS Sales Team
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://aks-sales.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
